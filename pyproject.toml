[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lumen-image-analyzer"
version = "0.1.0"
description = "Image analysis and statistics CLI tool"
requires-python = ">=3.13"

dependencies = [
    "numpy",
    "pillow",
    "pydantic",
    "typer",
]

[project.scripts]
image-analyzer = "main:cli"

[tool.setuptools]
py-modules = ["main", "config"]

[tool.setuptools.packages.find]
include = ["image_analyzer*"]
